<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Crown — Playroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --paper:#FFFFFF;
    --grey:#6B6B6B;
    --line:#E4E4E4;
    --line-soft:#EFEFEF;
    --red:#C0392B;
    --green:#2FBE5B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:960px;margin:0 auto;padding:40px 24px 100px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
  h1.page-title{font-family:'Archivo Black',sans-serif;font-size:clamp(32px,7vw,64px);line-height:0.95;margin:0 0 24px;letter-spacing:-0.01em;}

  .controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px;}
  .month-nav{display:flex;align-items:center;gap:16px;}
  .month-nav button{width:34px;height:34px;border:1px solid var(--ink);background:var(--paper);border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;}
  .month-nav button:hover{background:var(--ink);color:var(--paper);}
  .month-nav h2{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:22px;margin:0;min-width:180px;text-align:center;}

  .new-btn{font-family:'Archivo Black',sans-serif;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;padding:12px 22px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;}
  .new-btn:hover{opacity:0.85;}

  .weekday-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:4px;}
  .weekday-row div{font-family:'Archivo Black',sans-serif;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey);text-align:center;padding-bottom:8px;}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);}
  .day-cell{background:var(--paper);min-height:96px;min-width:0;overflow:hidden;padding:8px 6px;position:relative;cursor:pointer;}
  .day-cell.pad{background:var(--line-soft);}
  .day-num{font-family:'Archivo Black',sans-serif;font-size:13px;margin-bottom:6px;}
  .day-cell.today .day-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--ink);color:var(--paper);border-radius:50%;}
  .chip{display:block;font-size:11px;background:var(--line-soft);border-radius:4px;padding:3px 6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .state-msg{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--grey);font-size:14px;}

  /* Modal */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;z-index:40;}
  .backdrop.open{display:block;}
  .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,480px);max-height:88vh;overflow-y:auto;background:var(--paper);border-radius:10px;padding:28px;z-index:50;display:none;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .modal.open{display:block;}
  .modal h3{font-family:'Archivo Black',sans-serif;font-size:18px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--grey);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;font-family:'Space Grotesk',sans-serif;font-size:14px;padding:9px 10px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
  .field textarea{min-height:70px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .checkline{display:flex;align-items:center;gap:8px;}
  .checkline input{width:auto;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn{font-family:'Archivo Black',sans-serif;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;padding:11px 18px;border-radius:999px;border:1px solid var(--ink);cursor:pointer;flex:1;}
  .btn.primary{background:var(--ink);color:var(--paper);}
  .btn.secondary{background:var(--paper);color:var(--ink);}
  .form-error{font-size:12.5px;color:var(--red);margin-top:10px;display:none;}
  .form-error.show{display:block;}
  .form-success{font-size:12.5px;color:var(--green);margin-top:10px;display:none;}
  .form-success.show{display:block;}

  .day-panel{background:var(--line-soft);border-radius:8px;padding:16px;margin-top:16px;display:none;}
  .day-panel.open{display:block;}
  .day-panel h4{font-family:'Archivo Black',sans-serif;font-size:13px;margin:0 0 10px;}
  .booking-row{background:var(--paper);border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .booking-row .bt{font-weight:600;}
  .booking-row .bm{color:var(--grey);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="wordmark" style="font-family:'Archivo Black',sans-serif;font-size:11px;letter-spacing:0.14em;">THE CROWN</div>
  </div>
  <h1 class="page-title">Playroom</h1>

  <div class="controls">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&#8592;</button>
      <h2 id="monthLabel"></h2>
      <button onclick="changeMonth(1)">&#8594;</button>
    </div>
    <button class="new-btn" onclick="openNewBooking()">+ New Booking</button>
  </div>

  <div class="weekday-row">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="day-panel" id="dayPanel">
    <h4 id="dayPanelTitle"></h4>
    <div id="dayPanelList"></div>
  </div>
</div>

<div class="backdrop" id="backdrop" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <h3>New Booking</h3>
  <div class="row2">
    <div class="field"><label>Date</label><input type="date" id="f-date"></div>
    <div class="field"><label>Start time</label><input type="time" id="f-time"></div>
  </div>
  <div class="field">
    <label>Duration</label>
    <div class="row2">
      <div>
        <select id="f-duration-hours">
          <option value="0" selected>0 hrs</option>
          <option value="1">1 hr</option>
          <option value="2">2 hrs</option>
          <option value="3">3 hrs</option>
          <option value="4">4 hrs</option>
          <option value="5">5 hrs</option>
          <option value="6">6 hrs</option>
        </select>
      </div>
      <div>
        <select id="f-duration-minutes">
          <option value="0">0 min</option>
          <option value="15">15 min</option>
          <option value="30" selected>30 min</option>
          <option value="45">45 min</option>
        </select>
      </div>
    </div>
  </div>
  <div class="field"><label>Domme</label><input type="text" id="f-domme" list="domme-options" placeholder="Type to search…" autocomplete="off"><datalist id="domme-options"></datalist></div>
  <div class="field"><label>Client</label><input type="text" id="f-client" list="client-options" placeholder="Type to search…" autocomplete="off"><datalist id="client-options"></datalist></div>
  <div class="field"><label>Is it shadowable?</label><select id="f-shadowable"><option value="">—</option></select></div>
  <div class="field checkline"><input type="checkbox" id="f-deposit"><label style="margin:0;text-transform:none;font-size:13px;color:var(--ink);" for="f-deposit">Deposit received</label></div>
  <div class="field"><label>Notes</label><textarea id="f-notes"></textarea></div>

  <div class="modal-actions">
    <button class="btn secondary" onclick="closeModal()">Cancel</button>
    <button class="btn primary" id="book-btn" onclick="submitBooking()">Book</button>
  </div>
  <div class="form-error" id="formError"></div>
  <div class="form-success" id="formSuccess"></div>
</div>

<script>
// ---- CONFIGURE THIS after you deploy the Vercel project ----
const API_BASE = 'https://taillor-bookings-proxy.vercel.app';

let viewMonth = new Date().getMonth();
let viewYear = new Date().getFullYear();
let allBookings = [];
let schema = { room: [], shadowable: [], deposit: [], dommes: [], clients: [] };
let depositOptionIdForYes = null; // resolved after schema loads
let playroomOptionId = null; // resolved after schema loads — all bookings go here
let dommeLabelToId = {};
let clientLabelToId = {};

async function loadSchema(){
  try{
    const resp = await fetch(`${API_BASE}/api/schema`);
    schema = await resp.json();
    fillSelect('f-shadowable', schema.shadowable, 'text');
    dommeLabelToId = {}; // populated live by setupReferenceSearch as the person types
    clientLabelToId = {};
    // Every booking goes in Playroom — resolve its option id once, no UI picker needed.
    const playroomOpt = (schema.room || []).find(o => (o.text || '').toLowerCase() === 'playroom');
    playroomOptionId = playroomOpt ? playroomOpt.id : null;
    if(!playroomOptionId) console.warn('Could not find a "Playroom" option in the Room field — bookings will be created without a room.');
    // "Deposit received" is a checkbox but Podio stores it as a category option —
    // use the first option returned as the "yes" id (adjust if your options aren't [Yes, No]).
    if(schema.deposit && schema.deposit.length){
      depositOptionIdForYes = schema.deposit[0].id;
    }
  }catch(e){
    console.error('Failed to load schema', e);
  }
}

function fillSelect(id, items, labelKey){
  const el = document.getElementById(id);
  (items || []).forEach(it => {
    const opt = document.createElement('option');
    opt.value = it.id;
    opt.textContent = it[labelKey];
    el.appendChild(opt);
  });
}

// Live type-ahead search against Podio's own "find referenceable items" endpoint —
// no preloading, no cap, always fully in sync with the actual Podio data. Some
// titles are exact duplicates (e.g. two different people both named "Tom 2963") —
// when a search result set contains a collision, the item id is appended to the
// visible label so each option stays uniquely selectable.
function setupReferenceSearch(inputId, datalistId, fieldName, labelMapSetter){
  const input = document.getElementById(inputId);
  const datalist = document.getElementById(datalistId);
  let debounceTimer = null;

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = input.value.trim();
    debounceTimer = setTimeout(async () => {
      try{
        const resp = await fetch(`${API_BASE}/api/search-reference?field=${fieldName}&q=${encodeURIComponent(q)}`);
        const data = await resp.json();
        const items = data.results || [];

        const counts = {};
        items.forEach(it => { counts[it.title] = (counts[it.title] || 0) + 1; });

        const labelToId = {};
        datalist.innerHTML = '';
        items.forEach(it => {
          const label = counts[it.title] > 1 ? `${it.title} (#${it.id})` : it.title;
          labelToId[label] = it.id;
          const opt = document.createElement('option');
          opt.value = label;
          datalist.appendChild(opt);
        });
        labelMapSetter(labelToId);
      }catch(e){
        // transient search failure — leave existing suggestions in place
      }
    }, 250);
  });
}

async function loadBookings(){
  document.getElementById('grid').innerHTML = `<div class="state-msg">Loading…</div>`;
  try{
    const resp = await fetch(`${API_BASE}/api/bookings`);
    if(!resp.ok) throw new Error('Bookings fetch returned ' + resp.status);
    const data = await resp.json();
    allBookings = (data.bookings || []).map(b => ({...b, start: b.start ? new Date(b.start) : null, end: b.end ? new Date(b.end) : null}));
  }catch(e){
    document.getElementById('grid').innerHTML = `<div class="state-msg">Couldn't load bookings (${e.message}).</div>`;
    return;
  }
  renderCalendar();
}

function bookingsOnDate(y,m,d){
  return allBookings.filter(b => b.start && b.start.getFullYear()===y && b.start.getMonth()===m && b.start.getDate()===d)
    .sort((a,b)=>a.start-b.start);
}

function dayCellHtml(y,m,d,isToday,isPad){
  const bs = bookingsOnDate(y,m,d);
  let chips = '';
  bs.slice(0,3).forEach(b=>{
    const t = b.start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    chips += `<span class="chip">${t} ${b.domme?.title || b.client?.title || 'Booking'}</span>`;
  });
  if(bs.length>3) chips += `<span class="chip">+${bs.length-3} more</span>`;
  const classes = ['day-cell'];
  if(isPad) classes.push('pad');
  if(isToday) classes.push('today');
  return `<div class="${classes.join(' ')}" onclick="showDay(${y},${m},${d})"><div class="day-num">${d}</div>${chips}</div>`;
}

function renderCalendar(){
  const grid = document.getElementById('grid');
  document.getElementById('monthLabel').textContent = new Date(viewYear,viewMonth,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const firstDay = new Date(viewYear,viewMonth,1).getDay();
  const daysInMonth = new Date(viewYear,viewMonth+1,0).getDate();
  const daysInPrevMonth = new Date(viewYear,viewMonth,0).getDate();
  const prevMonth = viewMonth===0?11:viewMonth-1, prevYear = viewMonth===0?viewYear-1:viewYear;
  const nextMonth = viewMonth===11?0:viewMonth+1, nextYear = viewMonth===11?viewYear+1:viewYear;
  const today = new Date();
  let html='';
  for(let i=firstDay-1;i>=0;i--){
    const d = daysInPrevMonth-i;
    const isToday = today.getFullYear()===prevYear && today.getMonth()===prevMonth && today.getDate()===d;
    html += dayCellHtml(prevYear,prevMonth,d,isToday,true);
  }
  for(let d=1; d<=daysInMonth; d++){
    const isToday = today.getFullYear()===viewYear && today.getMonth()===viewMonth && today.getDate()===d;
    html += dayCellHtml(viewYear,viewMonth,d,isToday,false);
  }
  const total = firstDay+daysInMonth, rem = total%7;
  if(rem!==0){
    for(let i=1;i<=7-rem;i++){
      const isToday = today.getFullYear()===nextYear && today.getMonth()===nextMonth && today.getDate()===i;
      html += dayCellHtml(nextYear,nextMonth,i,isToday,true);
    }
  }
  grid.innerHTML = html;
}

function changeMonth(delta){
  viewMonth += delta;
  if(viewMonth>11){viewMonth=0;viewYear++;}
  if(viewMonth<0){viewMonth=11;viewYear--;}
  renderCalendar();
}

function showDay(y,m,d){
  const bs = bookingsOnDate(y,m,d);
  const panel = document.getElementById('dayPanel');
  const dateLabel = new Date(y,m,d).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  document.getElementById('dayPanelTitle').textContent = dateLabel + (bs.length ? ` — ${bs.length} booking${bs.length>1?'s':''}` : ' — no bookings');
  let rows = '';
  bs.forEach(b=>{
    const t1 = b.start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    const t2 = b.end ? b.end.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '';
    rows += `<div class="booking-row"><div class="bt">${t1}${t2?' – '+t2:''} · ${b.domme?.title || '—'}</div><div class="bm">${b.client?.title || ''}${b.room?.text ? ' · '+b.room.text : ''}</div></div>`;
  });
  document.getElementById('dayPanelList').innerHTML = rows || '<div class="bm">Nothing booked this day.</div>';
  panel.classList.add('open');
  window.__prefillDate = new Date(y,m,d);
}

function openNewBooking(){
  document.getElementById('formError').classList.remove('show');
  document.getElementById('formSuccess').classList.remove('show');
  document.getElementById('f-domme').value = '';
  document.getElementById('f-client').value = '';
  const bookBtn = document.getElementById('book-btn');
  bookBtn.disabled = false;
  bookBtn.textContent = 'Book';
  const d = window.__prefillDate || new Date();
  document.getElementById('f-date').value = d.toISOString().slice(0,10);
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('modal').classList.remove('open');
}

function toPodioUtcString(dateObj){
  return dateObj.toISOString().slice(0,19).replace('T',' ');
}

function resetBookBtn(){
  const btn = document.getElementById('book-btn');
  btn.disabled = false;
  btn.textContent = 'Book';
}

async function submitBooking(){
  const btn = document.getElementById('book-btn');
  if (btn.disabled) return; // guards against a second click firing while the first request is still in flight
  btn.disabled = true;
  btn.textContent = 'Booking…';

  const errEl = document.getElementById('formError');
  const okEl = document.getElementById('formSuccess');
  errEl.classList.remove('show'); okEl.classList.remove('show');

  const dateVal = document.getElementById('f-date').value;
  const timeVal = document.getElementById('f-time').value;
  const hoursVal = parseInt(document.getElementById('f-duration-hours').value, 10) || 0;
  const minutesVal = parseInt(document.getElementById('f-duration-minutes').value, 10) || 0;
  const durationMin = hoursVal * 60 + minutesVal;

  if(!dateVal || !timeVal){
    errEl.textContent = 'Date and start time are required.';
    errEl.classList.add('show');
    resetBookBtn();
    return;
  }
  if(durationMin <= 0){
    errEl.textContent = 'Duration must be more than 0 minutes.';
    errEl.classList.add('show');
    resetBookBtn();
    return;
  }

  const startLocal = new Date(`${dateVal}T${timeVal}:00`);
  const endLocal = new Date(startLocal.getTime() + durationMin*60000);

  const dommeText = document.getElementById('f-domme').value.trim();
  const clientText = document.getElementById('f-client').value.trim();
  const dommeId = dommeText ? dommeLabelToId[dommeText] : undefined;
  const clientId = clientText ? clientLabelToId[clientText] : undefined;

  if (!dommeText){
    errEl.textContent = 'Domme is required.';
    errEl.classList.add('show');
    resetBookBtn();
    return;
  }
  if (dommeText && !dommeId){
    errEl.textContent = `"${dommeText}" isn't a Domme from the list — pick one from the dropdown suggestions.`;
    errEl.classList.add('show');
    resetBookBtn();
    return;
  }
  if (!clientText){
    errEl.textContent = 'Client is required.';
    errEl.classList.add('show');
    resetBookBtn();
    return;
  }
  if (clientText && !clientId){
    errEl.textContent = `"${clientText}" isn't a Client from the list — pick one from the dropdown suggestions.`;
    errEl.classList.add('show');
    resetBookBtn();
    return;
  }

  const body = {
    start: toPodioUtcString(startLocal),
    end: toPodioUtcString(endLocal),
    room: playroomOptionId || undefined,
    dommeId: dommeId || undefined,
    clientId: clientId || undefined,
    shadowable: document.getElementById('f-shadowable').value || undefined,
    deposit: document.getElementById('f-deposit').checked ? depositOptionIdForYes : undefined,
    notes: document.getElementById('f-notes').value || undefined,
  };

  try{
    const resp = await fetch(`${API_BASE}/api/bookings`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if(resp.status === 409){
      errEl.textContent = data.error + (data.conflictingBooking ? ` (conflicts with ${data.conflictingBooking.client || 'existing booking'} at ${data.conflictingBooking.start})` : '');
      errEl.classList.add('show');
      resetBookBtn();
      return;
    }
    if(!resp.ok){
      errEl.textContent = data.error || `Server error (${resp.status})`;
      errEl.classList.add('show');
      resetBookBtn();
      return;
    }
    okEl.textContent = 'Booked!';
    okEl.classList.add('show');
    await loadBookings();
    setTimeout(closeModal, 900);
  }catch(e){
    errEl.textContent = 'Network error: ' + e.message;
    errEl.classList.add('show');
    resetBookBtn();
  }
}

loadSchema();
loadBookings();
setupReferenceSearch('f-domme', 'domme-options', 'domme', (map) => { dommeLabelToId = map; });
setupReferenceSearch('f-client', 'client-options', 'client', (map) => { clientLabelToId = map; });
</script>
</body>
</html>
